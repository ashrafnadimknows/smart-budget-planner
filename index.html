<!DOCTYPE html>
<html lang="en">
<head>
    <title>Smart Budget Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">

  <header>
    <h1>Smart <span class="mark">Budget</span> Planner</h1>
    <p>A notebook for your money — plan it, track it, save it.</p>
  </header>
 <div class="layout">
 <div class="card">
  <h2>Monthly Details</h2>

 <div class="field income-field">
 <label for="income">Monthly Income</label>
 <input type="number" id="income" placeholder="e.g.8000">
 </div>

 <div class="field">
 <label for="rent">Rent/Hostel</label>
 <input type="number" id="rent" placeholder="0">
 </div>

 <div class="field">
 <label for="food">Food</label>
 <input type="number" id="food" placeholder="0">
 </div>

 <div class="field">
 <label for="transport">Transportation</label>
 <input type="number" id="transport" placeholder="0">
 </div>

 <div class="field">
 <label for="shopping">Shopping</label>
 <input type="number" id="shopping" placeholder="0">
 </div>

 <div class="field">
 <label for="other">Other Expenses</label>
 <input type="number" id="other" placeholder="0">
 </div>

 <button id="calcBtn" onclick="calculateBudget()">Calculate</button>
 </div>
 
<div class="card results">
      <div class="spiral">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="card-inner">
        <h2>Your Summary</h2>

        <div class="stat-row">
          <span class="label">Total Expenses</span>
          <span class="value" id="totalExpenses">0</span>
        </div>

        <div class="stat-row">
          <span class="label">Remaining Balance</span>
          <span class="value" id="remainingBalance">0</span>
        </div>

        <div class="stat-row">
          <span class="label">Saving Percentage</span>
          <span class="value" id="savingPercent">0%</span>
        </div>

        <div id="statusBox">Fill in the form and press Calculate</div>

        <div class="jar-wrap">
          <div class="jar"><div id="jarFill"></div></div>
          <div class="jar-label">savings jar</div>
        </div>
      </div>
    </div>

  </div>

  <footer>Frontend demo only — nothing is saved or sent anywhere.</footer>

</div>

<script src="script.js"></script>

</body>
</html>
